<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background-color: #F4F4F6; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { background-color: #800020; color: #fff; padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 26px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
  .logo-icon { background: #E8C5C8; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #800020; font-size: 22px; }
  .header-link { color: #E8C5C8; text-decoration: none; font-weight: 600; font-size: 14px; }
  .header-link:hover { color: #FFF; }

  /* Main Container */
  .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { background: #FFFFFF; width: 100%; max-width: 480px; border-radius: 12px; border: 1px solid #E8C5C8; padding: 35px; box-shadow: 0 4px 15px rgba(128, 0, 32, 0.08); }

  .auth-card h2 { color: #800020; text-align: center; font-size: 24px; margin-bottom: 8px; font-weight: 700; }
  .auth-card p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }

  /* Form Elements */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
  .form-group input { width: 100%; padding: 11px 14px; border: 1px solid #CCC; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: #800020; }

  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }

  /* Terms Checkbox */
  .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; font-size: 13px; color: #555; }
  .checkbox-group input { accent-color: #800020; width: 16px; height: 16px; cursor: pointer; }

  /* Submit Button */
  .btn-submit { background-color: #800020; color: #FFFFFF; border: none; padding: 13px; border-radius: 6px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; transition: background-color 0.2s; }
  .btn-submit:hover { background-color: #5C0017; }

  /* Switch Form Link */
  .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
  .auth-footer a { color: #800020; text-decoration: none; font-weight: bold; }
  .auth-footer a:hover { text-decoration: underline; }

  /* Footer */
  footer { background-color: #800020; color: #E8C5C8; text-align: center; padding: 18px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-icon">🕊</div> Niara</div>
  <a href="index.html" class="header-link">← Повернутися на головну</a>
</header>

<div class="auth-container">
  <div class="auth-card">
    <h2>Створити акаунт</h2>
    <p class="subtitle">Приєднуйтесь до спільноти Niara для зручних покупок</p>

    <form>
      <div class="form-group">
        <label for="login">Логін</label>
        <input type="text" id="login" placeholder="Ваш логін">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="confirm-password">Підтвердження</label>
          <input type="password" id="confirm-password" placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label for="fullname">ПІБ</label>
        <input type="text" id="fullname" placeholder="Василенко Валерія">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="phone">Номер телефону</label>
          <input type="tel" id="phone" placeholder="+380 (99) 000-00-00">
        </div>
        <div class="form-group">
          <label for="city">Місто</label>
          <input type="text" id="city" placeholder="Місто">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Електронна пошта (Email)</label>
        <input type="email" id="email" placeholder="example@gmail.com">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required checked>
        <label for="terms">Я погоджуюся з умовами використання та політикою конфіденційності</label>
      </div>

      <button type="button" class="btn-submit">Зареєструватися</button>
    </form>

    <div class="auth-footer">
      Вже є акаунт? <a href="#">Увійти</a>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Інтернет-магазин «Niara». Усі права захищено.</p>
</footer>

</body>
</html>
